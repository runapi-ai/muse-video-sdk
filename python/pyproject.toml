[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-muse-video"
version = "0.2.0"
description = "RunAPI Muse Video SDK for text-to-video and single-image-to-video workflows in JavaScript, Python, Ruby, Go, and Java"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "muse-video", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "text-to-video", "image-to-video"]
dependencies = ["runapi-core~=0.12.0"]

[project.urls]
Homepage = "https://runapi.ai/models/muse-video"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/muse-video-sdk"
Issues = "https://github.com/runapi-ai/muse-video-sdk/issues"
Changelog = "https://github.com/runapi-ai/muse-video-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/muse-video-sdk/releases/tag/python%2Fv0.2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "muse-video"
